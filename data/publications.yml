- title: Excess Death Rates for Republican and Democratic Registered Voters in Florida and Ohio During
    the COVID-19 Pandemic
  coauthors: Paul Goldsmith-Pinkham and Jason Schwartz
  year: 2023
  section: policy
  venue: JAMA Internal Medicine
  cite: "183(9): 916–923"
  doi: 10.1001/jamainternmed.2023.1154
  nber: ""
  pdf: ""
  theme: ""
  abstract: >-
    Importance: There is evidence that Republican-leaning counties have had higher COVID-19 death rates
    than Democratic-leaning counties and similar evidence of an association between political party affiliation
    and attitudes regarding COVID-19 vaccination; further data on these rates may be useful. Objective:
    To assess political party affiliation and mortality rates for individuals during the initial 22 months
    of the COVID-19 pandemic. Design, Setting, And Participants: A cross-sectional comparison of excess
    mortality between registered Republican and Democratic voters between March 2020 and December 2021
    adjusted for age and state of voter registration was conducted. Voter and mortality data from Florida
    and Ohio in 2017 linked to mortality records for January 1, 2018, to December 31, 2021, were used
    in data analysis. Exposures: Political party affiliation. Main Outcomes And Measures: Excess weekly
    deaths during the COVID-19 pandemic adjusted for age, county, party affiliation, and seasonality.
    Results: Between January 1, 2018, and December 31, 2021, there were 538 159 individuals in Ohio and
    Florida who died at age 25 years or older in the study sample. The median age at death was 78 years
    (IQR, 71-89 years). Overall, the excess death rate for Republican voters was 2.8 percentage points,
    or 15%, higher than the excess death rate for Democratic voters (95% prediction interval [PI], 1.6-3.7
    percentage points). After May 1, 2021, when vaccines were available to all adults, the excess death
    rate gap between Republican and Democratic voters widened from -0.9 percentage point (95% PI, -2.5
    to 0.3 percentage points) to 7.7 percentage points (95% PI, 6.0-9.3 percentage points) in the adjusted
    analysis; the excess death rate among Republican voters was 43% higher than the excess death rate
    among Democratic voters. The gap in excess death rates between Republican and Democratic voters was
    larger in counties with lower vaccination rates and was primarily noted in voters residing in Ohio.
    Conclusions And Relevance: In this cross-sectional study, an association was observed between political
    party affiliation and excess deaths in Ohio and Florida after COVID-19 vaccines were available to
    all adults. These findings suggest that differences in vaccination attitudes and reported uptake between
    Republican and Democratic voters may have been factors in the severity and trajectory of the pandemic
    in the US.
