- title: Dental Coverage Through Medicaid Managed Care vs Fee-for-Service
  coauthors: Hawazin Elani, Ningsheng Zhao, and Benjamin D. Sommers
  year: 2026
  section: policy
  venue: JAMA Health Forum
  cite: "7(2): e256958"
  doi: 10.1001/jamahealthforum.2025.6958
  nber: ""
  pdf: ""
  theme: ""
  abstract: >-
    Importance Adult dental coverage under Medicaid varies widely across states and delivery systems.
    Most adult beneficiaries are now enrolled in managed care, yet little is known about how these benefits
    are structured and implemented within Medicaid managed care organizations (MCOs). Objective To examine
    trends in the generosity, delivery models, and enrollment patterns of adult dental benefits delivered
    through Medicaid MCOs and assess coverage alignment with Medicaid fee-for-service (FFS) coverage.
    Design, Setting, and Participants This cross-sectional analysis included adult Medicaid beneficiaries
    aged 19 years or older who had state Medicaid MCO or FFS coverage across all 50 states and Washington,
    DC. This analysis used a novel linked national dataset combining multiple Centers for Medicare &amp;amp;
    Medicaid Services administrative sources from 2016 to 2022. The analysis was conducted from April
    8, 2025, to October 8, 2025. Exposures State-level Medicaid MCO or FFS program with adult comprehensive
    dental coverage, emergency-only dental coverage, or no dental coverage. Main Outcomes and Measures
    The generosity of dental benefits; the degree of alignment in benefit generosity between Medicaid
    MCO and Medicaid FFS programs; and enrollment of adults in dental MCO or FFS programs by benefit (coverage)
    type. Results The number of states offering comprehensive adult dental benefits through Medicaid MCOs
    increased from 33 (64.7%) in 2016 to 36 (70.6%) in 2022. Carve-out models, typically using stand-alone
    prepaid health plans for dental coverage, increased from 4 states (7.8%) in 2016 to 8 states (15.7%)
    in 2022. In 2016, 51.0% of states had mismatched benefit levels between MCO and FFS programs compared
    with 35.3% in 2022. The number of MCO enrollees with comprehensive dental coverage increased from
    14.2 million (58.7%) in 2016 to 25.3 million (59.8%) in 2022, reflecting substantial managed care
    penetration. Conclusions and Relevance This study found that although the generosity and scope of
    MCO dental benefits expanded over time, alignment with FFS programs remained inconsistent. As new
    legislation cuts federal funding to states, understanding how dental benefits are designed and delivered
    is critical to inform future coverage decisions and ensure equitable access.
  press: []
  url: ""
- title: The Impact of Introducing Managed Care Intermediaries for Long-Term Services and Supports
  coauthors: Deepon Bhaumik, David Grabowski, and Mark Schlesinger
  year: 2025
  section: policy
  venue: Health Services Research
  cite: "60(4): e14462"
  doi: 10.1111/1475-6773.14462
  nber: ""
  pdf: ""
  theme: ""
  abstract: >-
    Objective: To study the impact of managed long-term services and supports (MLTSS) on the use of long-term
    care, as well as acute care. Study Setting And Design: We use a staggered difference-in-differences
    (DiDs) regression design, exploiting the variation in timing of the rollout of MLTSS programs across
    states between 2004 and 2018. We compared individuals in states that implemented MLTSS with individuals
    in states that did not implement MLTSS. Our outcomes included formal home care use, nursing home status,
    informal care use, hospitalizations, overnight nursing home visits, and falls. Data Source And Analytic
    Sample: This study uses secondary data from the Health and Retirement Study data, linked with state
    identifiers. The sample includes adults aged 65 and older who report at least one functional limitation.
    Principal Findings: The shift to MLTSS leads to a 2.5 percentage point (pp) increase (95% CI: 0.8
    pp, 4.3 pp) in home care users, a 3-percentage point decrease (95% CI: -5.38 pp, -0.25 pp) in informal
    care users, and no statistically significant change in nursing home occupancy or health outcomes.
    We also find suggestive evidence of reductions in the number of home care individuals living in MLTSS
    states receive, with a 7.02-h (95% CI: -12.96, -1.07), or nearly 27% decrease, in monthly formal care
    received by this population. Conclusion: These findings suggest that MLTSS increased the share of
    home and community-based services (HCBS) users but restricted the amount of HCBS used per beneficiary,
    with ambiguity around whether this occurred at the expense of beneficiaries.
