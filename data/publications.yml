- title: Alternative Payment Models and Performance in Federally Qualified Health Centers
  coauthors: Justin Markowski, Mark Schlesinger, and Chima D. Ndumele
  year: 2024
  section: policy
  venue: JAMA Internal Medicine
  cite: "184(9): 1065–1073"
  doi: 10.1001/jamainternmed.2024.2754
  nber: ""
  pdf: ""
  theme: ""
  abstract: >-
    Importance: Several state Medicaid agencies have transitioned from traditional fee-for-service to
    a value-centric alternative payment model (APM) to reimburse federally qualified health centers (FQHCs).
    Little is known about the effects of this shift on FQHC performance. Objective: To assess the association
    between APMs and the clinical performance, payer mix, risk profile, and financial sustainability of
    FQHCs. Design, Setting, And Participants: This retrospective cohort study was performed in 684 FQHCs
    (representing 37 states plus the District of Columbia) that continuously operated between January
    2009 and December 2021. Data on payer mix (eg, type of insurance) and risk profile (eg, proportion
    of patients with chronic conditions) of FQHC patients were obtained from the Uniform Data System,
    and clinic-level financial data (eg, revenue) were obtained from Internal Revenue Service form 990
    tax documents. Data were analyzed between November 2022 and October 2023. Exposure: Initial rollout
    of a value-based payment model (ie, an APM) for FQHCs, as offered by state Medicaid program, between
    January 2013 and December 2021. Main Outcomes And Measures: The main outcomes were 4 audited process
    measures of health care quality (cervical and colorectal cancer screening and body mass index [BMI]
    assessment for adults and children) and 2 intermediate health outcome measures (hypertension control
    and diabetes control). A difference-in-differences design was used with staggered implementation comparing
    FQHCs before and after the initial APM rollout vs contemporaneous changes in FQHCs in states without
    APMs. Results: A total of 684 FQHCs (8892 FQHC-years) that served 17 823 959 patients in 2021 (57.3%
    female) were included in the study. Among FQHCs in states implementing APMs, significant differential
    increases in 3 of the 4 process quality measures were observed compared with FQHCs in states that
    did not implement an APM: colorectal cancer screening (3.24 percentage points [pp]; 95% CI, 1.40-5.08
    pp), adult BMI (3.19 pp; 95% CI, 0.70-5.68 pp), and child BMI (4.50 pp; 95% CI, 1.83-7.17 pp). There
    were also modest differential improvements in blood pressure control for individuals with hypertension
    (1.02 pp; 95% CI, 0.04-2.00 pp) and blood glucose control for individuals with type 2 diabetes (1.02
    pp; 95% CI, 0.02-2.02 pp) compared with FQHCs in states without an APM. There was no evidence that
    the APM rollout was associated with clinics selecting healthier patients (-0.01 pp; 95% CI, -0.21
    to 0.19 pp) or stinting on care (-0.02 visits; 95% CI, -0.08 to 0.04 visits). Conclusions And Relevance:
    In this cohort study, introduction of Medicaid APM options for FQHCs was associated with modest, statistically
    significant increases in quality concentrated among FQHCs with APM models that explicitly incentivized
    quality. This finding suggests that APMs can be both a financially viable and a health-promoting model
    for reimbursement in the health care safety net.
