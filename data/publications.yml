- title: In Medicaid Managed Care Networks, Care is Highly Concentrated Among a Small Percentage of Physicians
  coauthors: Avital B. Ludomirsky, William L. Schpero, Anthony Lollo, Susannah Bernheim, Joseph S. Ross,
    and Chima D. Ndumele
  year: 2022
  section: policy
  venue: Health Affairs
  cite: "41(5): 760–768"
  doi: 10.1377/hlthaff.2021.01747
  nber: ""
  pdf: ""
  theme: ""
  abstract: >-
    States have increasingly outsourced the provision of Medicaid services to private managed care plans.
    To ensure that plans maintain access to care, many states set network adequacy standards that require
    plans to contract with a minimum number of physicians. In this study we used data from the period
    2015-17 for four states to assess the level of Medicaid participation among physicians listed in the
    provider network directories of each managed care plan. We found that about one-third of outpatient
    primary care and specialist physicians contracted with Medicaid managed care plans in our sample saw
    fewer than ten Medicaid beneficiaries in a year. Care was highly concentrated: 25 percent of primary
    care physicians provided 86 percent of the care, and 25 percent of specialists, on average, provided
    75 percent of the care. Our findings suggest that current network adequacy standards might not reflect
    actual access; new methods are needed that account for beneficiaries' preferences and physicians'
    willingness to serve Medicaid patients.
