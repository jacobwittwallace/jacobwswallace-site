- title: Availability Of Adult Dental Plans In The Affordable Care Act Marketplaces, 2016–23
  coauthors: Hawazin Elani, Md Shahinoor Rahman, Meredith Rosenthal, and Benjamin D Sommers
  year: 2024
  section: policy
  venue: Health Affairs
  cite: "43(11): 1587–96"
  doi: 10.1377/hlthaff.2024.00307
  nber: ""
  pdf: ""
  theme: ""
  abstract: >-
    The Affordable Care Act Marketplaces may improve access to dental insurance, but little is known about
    the availability of such coverage. We used data from state and federal Marketplace sources to describe
    the availability of adult dental plans, including Stand-alone Dental Plans and those embedded in medical
    plans. We also examined the characteristics of counties with limited dental insurer participation
    and those that experienced a net loss of Stand-alone Dental Plan insurers between 2016 and 2023. We
    found that in 2023, at least one Stand-alone Dental Plan was offered in every state, and thirty-six
    states offered embedded dental plans. Most counties (63.6 percent) had access to more than five insurers
    offering adult dental plans, whereas approximately 4 percent had only one insurer offering adult dental
    plans. Counties in state-based Marketplaces, rural areas, and dentist shortage areas were more likely
    to be counties with limited dental insurer participation. The net loss of Stand-alone Dental Plans
    between 2016 and 2023 was more common in state-based Marketplaces and disadvantaged counties. Our
    findings can inform future policies to improve the dental insurance Marketplace and access to affordable
    dental care.
  press: []
  url: ""
- title: Medicare eligibility and changes in coverage, access to care, and health by sexual orientation
    and gender identity
  coauthors: Kyle Gavulic
  year: 2024
  section: policy
  venue: JAMA Health Forum
  cite: "5(7): e241756"
  doi: 10.1001/jamahealthforum.2024.1756
  nber: ""
  pdf: ""
  theme: ""
  abstract: >-
    Importance: Medicare provides nearly universal insurance coverage at age 65 years. However, how Medicare
    eligibility affects disparities in health insurance coverage, access to care, and health status among
    individuals by sexual orientation and gender identity is poorly understood. Objective: To assess the
    association of Medicare eligibility with disparities in health insurance coverage, access to care,
    and self-reported health status among individuals by sexual orientation and by gender identity. Design,
    Setting, And Participants: This cross-sectional study used the age discontinuity for Medicare eligibility
    at age 65 years to isolate the association of Medicare with health insurance coverage, access to care,
    and self-reported health status, by their sexual orientation and by their gender identity. Data were
    collected from the Behavioral Risk Factor Surveillance System for respondents from 51 to 79 years
    old from 2014 to 2021. Data analysis was performed from September 2022 to April 2023. Exposures: Medicare
    eligibility at age 65 years. Main Outcomes And Measures: Proportions of respondents with health insurance
    coverage, usual source of care, cost barriers to care, influenza vaccination, and self-reported health
    status. Results: The study population included 927 952 individuals (mean [SD] age, 64.4 [7.7] years;
    524 972 [56.6%] females and 402 670 [43.4%] males), of whom 28 077 (3.03%) identified as a sexual
    minority-lesbian, gay, bisexual, or another sexual minority identity (LGB+) and 3286 (0.35%) as transgender
    or gender diverse. Respondents who identified as heterosexual had greater improvements at age 65 years
    in insurance coverage (4.2 percentage points [pp]; 95% CI, 4.0-4.4 pp) than those who identified as
    LGB+ (3.6 pp; 95% CI, 2.3-4.8 pp), except when the analysis was limited to a subsample of married
    respondents. For access to care, improvements in usual source of care, cost barriers to care, and
    influenza vaccination were larger at age 65 years for heterosexual respondents compared with LGB+
    respondents, although confidence intervals were overlapping and less precise for LGB+ individuals.
    For self-reported health status, the analyses found larger improvements at age 65 years for LGB+ respondents
    compared with heterosexual respondents. There was considerable heterogeneity by state in disparities
    by sexual orientation among individuals who were nearly eligible for Medicare (close to 65 years old),
    with the US South and Central states demonstrating the highest disparities. Among the top-10 highest-disparities
    states, Medicare eligibility was associated with greater increases in coverage (6.7 pp vs 5.0 pp)
    and access to a usual source of care (1.4 pp vs 0.6 pp) for LGB+ respondents compared with heterosexual
    respondents. Conclusions And Relevance: The findings of this cross-sectional study indicate that Medicare
    eligibility was not associated with consistently greater improvements in health insurance coverage
    and access to care among LGBTQI+ individuals compared with heterosexual and/or cisgender individuals.
    However, among sexual minority individuals, Medicare may be associated with closing gaps in self-reported
    health status, and among states with the highest disparities, it may improve health insurance coverage,
    access to care, and self-reported health status.
