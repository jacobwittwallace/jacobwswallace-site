- title: "Adverse Selection and Network Design Under Regulated Plan Prices: Evidence from Medicaid"
  coauthors: Amanda Kreider, Timothy J. Layton, and Mark Shepard
  year: 2024
  section: econ
  venue: Journal of Health Economics
  cite: "97: 102901"
  doi: 10.1016/j.jhealeco.2024.102901
  nber: "https://www.nber.org/papers/w30719"
  pdf: ""
  replication: "https://doi.org/10.3886/E225887"
  theme: Plan & network design
  abstract: >-
    Health plans for the poor increasingly limit access to specialty hospitals. We investigate the role
    of adverse selection in generating this equilibrium among private plans in Medicaid. Studying a network
    change, we find that covering a top cancer hospital causes severe adverse selection, increasing demand
    for a plan by 50% among enrollees with cancer versus no impact for others. Medicaid's fixed insurer
    payments make offsetting this selection, and the contract distortions it induces, challenging, requiring
    either infeasibly high payment rates or near-perfect risk adjustment. By contrast, a small explicit
    bonus for covering the hospital is sufficient to make coverage profitable.
  press: []
