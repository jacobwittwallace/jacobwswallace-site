- title: "Understanding Medicaid Managed Care: The Procured Competition Model"
  coauthors: Mark Shepard
  year: 2026
  section: econ
  venue: Journal of Economic Perspectives
  cite: "40(2): 171–94"
  doi: 10.1257/jep.20251475
  nber: "https://www.nber.org/papers/w35146"
  pdf: ""
  theme: Procurement & market design
  abstract: >-
    Medicaid is one of the largest public programs in the United States—providing health insurance to
    over 75 million low-income Americans—and over three quarters of its enrollees receive care via private
    “managed care” insurers. In this article, we make three central points about the economics of contracting
    out Medicaid to private insurers. First, the empirical evidence on Medicaid privatization is mixed:
    contracting out has not meaningfully reduced public costs or improved quality of care. Second, we
    propose a framework, which we call “procured competition,” to describe the unique structure of Medicaid
    managed care as a hybrid of public procurement and regulated competition. Third, we discuss the key
    policy levers across procurement, competition, and consumer choice in this model. Throughout, we highlight
    open research questions, arguing that the enormous variation in how states design these programs—combined
    with limited evidence on what works—represents a promising area for high-impact scholarship.
  press: []
  url: ""
- title: "Private Provision of Public Services: Evidence from Random Assignment in Medicaid"
  coauthors: Dan Macambira, Michael Geruso, Anthony Lollo, and Chima D. Ndumele
  year: 2026
  section: econ
  venue: American Economic Review
  cite: "116(6): 2038–84"
  doi: 10.1257/aer.20230541
  nber: "https://www.nber.org/papers/w30390"
  pdf: ""
  replication: "https://doi.org/10.3886/E231164"
  theme: Managed care & privatization
  abstract: >-
    This paper examines the effects of privatizing social health insurance. We exploit a natural experiment
    in Medicaid, wherein nearly 100,000 enrollees were randomly assigned between a publicly operated fee-for-service
    system and private managed care. Managed care reduced costs by 5.6 percent via cost-effective substitutions
    among prescription drugs and via lower prices for outpatient services. We present evidence that pharmacy
    utilization management was the key mechanism reducing overuse and encouraging substitution to lower-cost
    drugs without decreasing observed quality. In contrast, privatizing medical benefits led to only modest
    savings and was associated with decreased health care quality and consumer satisfaction. (JEL G22,
    H41, I13, I18, I38)
