- title: What Difference Does a Health Plan Make? Evidence from Random Plan Assignment in Medicaid
  coauthors: Timothy J. Layton and Michael Geruso
  year: 2023
  section: econ
  venue: "American Economic Journal: Applied Economics"
  cite: "15(3): 341–79"
  doi: 10.1257/app.20210843
  nber: "https://www.nber.org/papers/w27762"
  pdf: ""
  replication: "https://doi.org/10.3886/E175881"
  theme: Health plan effects
  abstract: >-
    Exploiting the random assignment of Medicaid beneficiaries to managed care plans, we find substantial
    plan-specific spending effects despite plans having identical cost sharing. Enrollment in the lowest-spending
    plan reduces spending by at least 25%-primarily through quantity reductions-relative to enrollment
    in the highest-spending plan. Rather than reducing "wasteful" spending, lower-spending plans broadly
    reduce medical service provision-including the provision of low-cost, high-value care-and worsen beneficiary
    satisfaction and health. Consumer demand follows spending: a 10 percent increase in plan-specific
    spending is associated with a 40 percent increase in market share. These facts have implications for
    the government's contracting problem and program cost growth.
  press: []
  url: ""
- title: "Measuring Changes in Disparity Gaps: An Application to Health Insurance"
  coauthors: Paul Goldsmith-Pinkham, Karen Jiang, and Zirui Song
  year: 2022
  section: econ
  venue: AEA Papers and Proceedings
  cite: "112: 356–60"
  doi: 10.1257/pandp.20221111
  nber: ""
  pdf: "https://drive.google.com/file/d/1eFO1b1xe6r1gxKymGYfoer5CLiCUs4F3/view?usp=sharing"
  theme: Measurement & equity
  abstract: >-
    We propose a method for reporting how program evaluations reduce gaps between groups, such as the
    gender or Black-White gap. We first show that the reduction in disparities between groups can be written
    as the difference in conditional average treatment effects (CATE) for each group. Then, using a Kitagawa-Oaxaca-Blinder-style
    decomposition, we highlight how these CATE can be decomposed into unexplained differences in CATE
    in other observables versus differences in composition across other observables (e.g. the “endowment”).
    Finally, we apply this approach to study the impact of Medicare on American's access to health insurance.
