- title: What Does a Provider Network Do? Evidence from Random Assignment in Medicaid Managed Care
  coauthors: ""
  year: 2023
  section: econ
  venue: "American Economic Journal: Economic Policy"
  cite: "15(1): 473–509"
  doi: 10.1257/pol.20210162
  nber: ""
  pdf: "https://drive.google.com/file/d/1yUZYegjb66ZUZPU19uujho4b27hFRDcU/view?usp=sharing"
  replication: "https://doi.org/10.3886/E157441"
  theme: Plan & network design
  abstract: >-
    Leveraging the random assignment of over 50,000 Medicaid enrollees in New York, I present causal evidence
    that narrower networks are a blunt instrument for reducing health care spending. While narrower networks
    constrain spending, they do so by generating hassle costs that reduce quantity, with modest effects
    on prices paid to providers. Enrollees assigned to narrower networks use fewer of both needed and
    unneeded services and are less satisfied with their plans. Using my causal estimates to construct
    counterfactuals, I identify an alternative assignment policy that reduces spending without harming
    satisfaction by matching consumers with narrower networks that include their providers. (JEL H51,
    H75, I13, I18, I38)
