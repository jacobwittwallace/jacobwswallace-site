# Featured research cards on the homepage (shown in this order; 3 fit one row on desktop).
# image: a file in assets/img/featured/. finding: one plain-language sentence. url: where the card links.
- label: "REStat, conditionally accepted"
  title: "The Great Equalizer: Medicare and the Geography of Consumer Financial Strain"
  finding: "Medicare at 65 cuts medical debt in collections by 30% and shrinks its geographic variation by two-thirds."
  image: "assets/img/featured/great-equalizer-map.webp"
  url: "https://www.nber.org/papers/w31223"
- label: "Journal of Economic Perspectives · 2026"
  title: "Understanding Medicaid Managed Care: The Procured Competition Model"
  finding: "Most Medicaid enrollees now get care through private insurers; we call this hybrid model 'procured competition' and discuss its decidedly mixed results."
  image: "assets/img/featured/jep-fig3-managed-care-spending-effects.png"
  url: "https://doi.org/10.1257/jep.20251475"
- label: "American Economic Review · 2026"
  title: "Private Provision of Public Services: Evidence from Random Assignment in Medicaid"
  finding: "Private Medicaid plans cut costs 5.6%, mostly by steering enrollees to cheaper drugs without lowering observed quality; on the medical side, savings were small and quality and satisfaction fell."
  image: "assets/img/featured/aer-denials-by-drug-class.png"
  url: "https://doi.org/10.1257/aer.20230541"
