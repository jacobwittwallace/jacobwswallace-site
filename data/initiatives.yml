  - id: learning-lab
    title: Medicaid Learning Lab
    meta: With J-PAL North America · Scientific Advisor
    image: assets/img/initiatives/learning-lab.jpg
    alt: Jacob Wallace on a panel at the Medicaid Learning Lab launch, with Connecticut's
      test-and-learn model on screen
    body: 'Developed by J-PAL North America with the SCALE Lab, the Medicaid Learning
      Lab helps state Medicaid agencies build test-and-learn capacity: using evidence
      in real decisions and, when conditions are right, generating new evidence through
      randomized evaluation. Agency teams receive a customized curriculum of workshops,
      peer learning and technical assistance, and strong designs can compete for evaluation
      awards of up to $400,000. The first cohort launched in June 2026 and convened
      at MIT that September.'
