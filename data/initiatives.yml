  - id: connecticut
    title: Connecticut Medicaid Partnership
    meta: With the Connecticut Department of Social Services · Supported by Arnold
      Ventures
    image: assets/img/initiatives/connecticut.png
    fit: contain
    alt: 'A rapid-cycle learning model: plan, do, study, act'
    body: Since a 2023 collaboration between Governor Lamont's administration and
      Yale, a SCALE team has worked inside Connecticut's Department of Social Services,
      which runs HUSKY Health (the state's Medicaid program) and SNAP. With agency
      staff, we co-design and field randomized evaluations of care management, member
      outreach and benefit take-up, and provide rapid-cycle analysis on the state's
      most pressing questions, so that results feed directly into program decisions.
    links:
