intro: Much of my work is done alongside or within state agencies. These are the initiatives
  I currently lead or co-lead.
initiatives:
  - id: scale-lab
    title: The SCALE Lab
    meta: State Collaborations to Advance LEarning · Yale School of Public Health
      · Co-directed with [Chima Ndumele](https://ysph.yale.edu/profile/chima-ndumele/)
    image: assets/img/initiatives/scale-lab.jpg
    alt: Chima Ndumele and Jacob Wallace at the lectern opening the 2024 Northeast
      Medicaid Research Symposium at Yale
    body: The SCALE Lab is a research and policy institute that forms hands-on partnerships
      with state policymakers to improve the social safety net. Its data scientists
      are employed by Yale but hold state credentials and work side by side with agency
      staff, so that new policies can be tested, refined and scaled while decisions
      are still open. The team of about a dozen researchers, data scientists, policy
      staff and trainees also studies Medicaid managed care, SNAP and the administrative
      burdens that keep eligible people from benefits.
