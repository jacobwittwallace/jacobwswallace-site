  - id: snap-accuracy
    title: SNAP Payment Accuracy
    meta: With Georgetown's Better Government Lab · Supported by the Center for Civic
      Futures (Public Benefit Innovation Fund)
    image: assets/img/initiatives/snap-accuracy.png
    fit: contain
    alt: Combining a state model and a federal model of SNAP payment-error risk into
      one risk score
    body: Starting in 2027, states' share of SNAP benefit costs will depend on their
      payment error rates. With the Better Government Lab, we are working with five
      states to deploy predictive models that flag the cases most likely to contain
      errors, so that states can catch mistakes more precisely without adding burden
      for families. The project was selected in the second round of the Public Benefit
      Innovation Fund. Our team also co-convenes workshops where states share data,
      code and lessons openly.
